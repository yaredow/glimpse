version: "2"
sql:
  - engine: "postgresql"
    queries: "internal/data/sql"
    schema: "migrations/"
    gen:
      go:
        package: "queries"
        out: "internal/data/queries"
        sql_package: "pgx/v5"
        emit_json_tags: true
        emit_interface: true
        emit_empty_slices: true
