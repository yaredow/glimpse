version: "2"
sql:
  - engine: "postgresql"
    queries: "internal/store/sql"
    schema: "migrations/"
    gen:
      go:
        package: "queries"
        out: "internal/store/queries"
        sql_package: "pgx/v5"
        overrides:
          - db_type: "pg_catalog.numeric"
            go_type: "float64"
          - db_type: "uuid"
            go_type:
              import: "github.com/google/uuid"
              type: "UUID"
          - db_type: "pg_catalog.timestamptz"
            go_type: "time.Time"
          - db_type: "date"
            go_type: "time.Time"
          - column: "users.password_hash"
            go_type:
              import: "github.com/yaredow/glimpse-api/internal/types"
              type: "Password"
        emit_json_tags: true
        emit_interface: true
        emit_empty_slices: true
